name: pin-refresh
description: >-
  Move a repository's family pins (its version-pins.toml locks, the pages they hold and
  any Homebrew formula) to the newest releases as a pull request and land it when every
  check is green. Run it after a family release and on a schedule; scripts/pin-refresh.py
  in this repository says what it does and why, and docs/pin-refresh.md which token to give.

inputs:
  configs:
    description: "version-pins.toml paths, one per line"
    required: false
    default: version-pins.toml
  ci:
    description: "workflow files whose runs decide the merge, one per line"
    required: true
  formulas:
    description: "true to move Homebrew formulas too (the caller sets up brew first)"
    required: false
    default: "false"
  tap:
    description: "the tap the formulas belong to, for brew (owner/name)"
    required: false
    default: ""
  app-client-id:
    description: >-
      Client ID of a GitHub App installed on this repository with contents and pull
      requests write and actions read. With app-private-key, the pull request is opened
      with the App's installation token, so it gets its own pull_request run, and is
      handed to auto-merge and the merge queue. Leave both empty to use token instead.
    required: false
    default: ""
  app-private-key:
    description: "that App's private key (a secret)"
    required: false
    default: ""
  token:
    description: >-
      used when no App is given: a token with contents, pull-requests and actions write
      on this repository; the action then dispatches the CI runs itself and waits for them
    required: false
    default: ${{ github.token }}
  dry-run:
    description: "true to show the bump and change nothing remote"
    required: false
    default: "false"
  verify-pr:
    description: >-
      a pull request number: change nothing, and fail unless each ci workflow has a
      pull_request run on its head that GitHub did not hold for approval
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: refuse one half of the App
      if: (inputs.app-client-id != '') != (inputs.app-private-key != '')
      shell: bash
      run: |
        echo "::error::pin-refresh was given one half of the App (app-client-id and app-private-key go together); a missing secret here would silently fall back to the Actions token"
        exit 2
    - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
      id: app
      if: inputs.app-client-id != '' && inputs.app-private-key != ''
      with:
        client-id: ${{ inputs.app-client-id }}
        private-key: ${{ inputs.app-private-key }}
        permission-contents: write
        permission-pull-requests: write
        permission-actions: read
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - name: move the pins, open the pull request, land it
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app.outputs.token || inputs.token }}
        GITHUB_TOKEN: ${{ steps.app.outputs.token || inputs.token }}
        APP: ${{ steps.app.outputs.token != '' }}
        CONFIGS: ${{ inputs.configs }}
        CI: ${{ inputs.ci }}
        FORMULAS: ${{ inputs.formulas }}
        TAP: ${{ inputs.tap }}
        DRY_RUN: ${{ inputs.dry-run }}
        VERIFY_PR: ${{ inputs.verify-pr }}
        SCRIPTS: ${{ github.action_path }}/../../scripts
      run: |
        set -euo pipefail
        args=()
        while IFS= read -r c; do [ -n "$c" ] && args+=(--config "$c"); done <<< "$CONFIGS"
        while IFS= read -r w; do [ -n "$w" ] && args+=(--ci "$w"); done <<< "$CI"
        if [ "$FORMULAS" = "true" ]; then args+=(--formulas --tap "$TAP"); fi
        if [ "$APP" = "true" ]; then
          echo "pin-refresh: App installation token (the pull request gets its own runs)"
          args+=(--pr-events)
        else
          echo "pin-refresh: Actions token (the action dispatches CI itself)"
        fi
        if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
        if [ -n "$VERIFY_PR" ]; then args+=(--verify-pr "$VERIFY_PR"); fi
        python3 -B "$SCRIPTS/pin-refresh.py" "${args[@]}"
