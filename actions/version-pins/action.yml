name: version-pins
description: >-
  Hold every version a repository's pages name to its manifest or to the family
  lock in version-pins.toml, and compare manifests, tags and registries. The one
  copy of scripts/version-pins.py lives in this repository; callers pin this
  action to a commit.

inputs:
  command:
    description: "check (offline), test (offline, plants a stale pin and requires check to fail), registry (network; a family lock may lag one release for one day), formulas (network) or badges (network)"
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: version-pins ${{ inputs.command }}
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
        SCRIPTS: ${{ github.action_path }}/../../scripts
        # The registry check reads GitHub attestations; an anonymous read shares one quota per runner address.
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        case "$COMMAND" in
          check | registry | badges | formulas) python3 -B "$SCRIPTS/version-pins.py" "$COMMAND" ;;
          test) VERSION_PINS_ROOT="$PWD" python3 -B "$SCRIPTS/version-pins-test.py" ThisRepository ;;
          *) echo "unknown command: $COMMAND" >&2; exit 2 ;;
        esac
