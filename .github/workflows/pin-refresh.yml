name: pin-refresh

# Moves the family lock in version-pins.toml, and the profile pages it holds, to the
# newest releases as a pull request that merges itself when the profile check is
# green (actions/pin-refresh). A family release dispatches it; the hourly run is the
# backstop for a missed dispatch, and registry-verify turns red when a lock lags one
# release for more than a day.

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      reason:
        description: "why it runs now (a release dispatch names the release)"
        required: false
        type: string
  repository_dispatch:
    types: [family-release]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: why
        env:
          REASON: ${{ inputs.reason || github.event.client_payload.release || github.event_name }}
        run: echo "pin-refresh reason $REASON"
      # main has a merge queue, and a pull request the Actions token opens gets no
      # pull_request run, so GitHub refuses to enqueue it ("Required status check ci-ok
      # is expected", run 44924281403). The org App's installation token gives the pull
      # request its own runs; until the App exists both values are empty and the action
      # falls back to the Actions token.
      - uses: ./actions/pin-refresh
        with:
          ci: profile.yml
          app-client-id: ${{ vars.PIN_REFRESH_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.PIN_REFRESH_APP_PRIVATE_KEY }}
          token: ${{ github.token }}
