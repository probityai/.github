name: Public profile

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "31 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request supersedes the older run; merge-queue
  # batches and pushes to main always finish.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  profile:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Check navigation controls
        run: python3 -m unittest discover -s tests -v
      - name: Every version the profile names equals the family lock
        uses: ./actions/version-pins
        with:
          command: check
      - name: The version-pins script keeps its contract
        run: python3 scripts/version-pins-test.py
      - name: The pin-refresh script keeps its contract
        run: python3 scripts/pin-refresh-test.py
      - name: A planted stale pin turns the check red here
        uses: ./actions/version-pins
        with:
          command: test
      - name: Read back public task and discovery links
        run: python3 scripts/check_profile.py

  # The one status the main ruleset requires. It runs even when a job fails or
  # is skipped, and passes only when every job it needs passed or was skipped
  # by path selection.
  ci-ok:
    if: always()
    needs: [profile]
    runs-on: ubuntu-latest
    steps:
      - name: Every selected job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "a required job ended $r"; exit 1 ;;
            esac
          done
