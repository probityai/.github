# Where each version the organization profile names is decided; scripts/version-pins.py
# holds the profile to it. Every package here is released by another repository, so
# each one is a family lock line; registry-verify fails when a line lags its release,
# and `python3 scripts/version-pins.py refresh` moves the lock and the page together.
repository = "probityai/.github"

[family]
"pypi:probityai" = "0.1.0"
"pypi:agent-evidence-vectors" = "0.31.0"
"pypi:probity-ratchet" = "0.3.0"
"pypi:agent-evidence-vocabulary" = "0.8.0"
"pypi:agent-evidence-admission" = "0.2.0"
"pypi:agent-evidence-observer" = "0.1.1"
"crates:dsse" = "0.1.6"
"crates:jcs-admit" = "0.1.3"
